x-spark-env: &spark-env
  environment:
    - SPARK_MODE=local
    - PYTHONPATH=/app:/opt/bitnami/spark/python:/opt/bitnami/spark/python/lib/py4j-0.10.9.7-src.zip
    - PYSPARK_DRIVER_PYTHON=python3
  env_file: .env
  volumes:
    - ./:/data
    - ./configs:/app/configs
    - ./schemas:/app/schemas

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__WEBSERVER__SECRET_KEY=retail_demo_secret
    - AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD=7200
    - AIRFLOW__SCHEDULER__ZOMBIE_DETECTION_INTERVAL=60
    - PIPELINE_IMAGE=config_based_data_processing-spark-pipeline
    - DOCKER_NETWORK=config_based_data_processing_default
    - PROJECT_DIR=${PROJECT_DIR}
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  # ── Object storage (S3-compatible) ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the initial bucket on first startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/retail
      "

  # ── Gold + watermark store ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=gold
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # Creates gold_schema and silver_schema in PostgreSQL (idempotent)
  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=postgres
    entrypoint: ["psql", "-h", "postgres", "-U", "postgres", "-d", "gold", "-c", "CREATE SCHEMA IF NOT EXISTS gold_schema; CREATE SCHEMA IF NOT EXISTS silver_schema;"]

  # ── Pipeline runner ────────────────────────────────────────────────────────
  spark-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *spark-env
    depends_on:
      minio:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    command: ["--dataset", "retail_orders", "--config-dir", "/app/configs"]

  # ── Test runner ────────────────────────────────────────────────────────────
  spark-test:
    build:
      context: .
      dockerfile: Dockerfile
    <<: *spark-env
    entrypoint: ["python", "-m", "pytest"]
    command: ["tests/", "-v", "--tb=short"]

  # ── Streamlit dashboard ────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy

  # ── Airflow metadata DB ───────────────────────────────────────────────────
  airflow-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=airflow
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5

  # Initialises Airflow DB and creates admin user (runs once)
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "airflow db upgrade && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"]

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8081:8080"
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  minio_data:
  postgres_data:
  airflow_db_data:
  airflow_logs:
